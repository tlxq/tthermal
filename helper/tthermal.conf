# tthermal tuning. Whole numbers only. Every line is commented out, so the
# built-in default applies; uncomment and change a value to override it.
# Apply with: sudo systemctl reload tthermal
# The max temperature itself is set from the panel, not here.

# Control loop period in milliseconds.
#interval_ms=500

# Seconds between status lines in the journal (journalctl -u tthermal).
#log_every_s=10

# Release the guard when the plugin has not checked in for this many seconds.
#heartbeat_timeout_s=90

# Lowest sustained power limit the guard may set, in watts.
#floor_w=6

# Burst limit: none within burst_from_c of max, full factory burst at
# burst_full_c or more below max, linear in between.
#burst_from_c=5
#burst_full_c=40

# Highest burst limit ever allowed, in watts (some firmware sets 51 W).
#pl2_max_w=29

# Long loads settle this many degrees under max.
#target_margin_c=2

# Calm: this many degrees or more under max (and not holding), a tick only
# reads the temperature; the guard, the fan and the status run every 2 s.
#calm_margin_c=15

# How fast the sustained limit moves: milliwatts per tick per degree off target.
#ki_mw=150

# Fan (ThinkPad). The fan level follows the temperature smoothed over ~10 s,
# so one-second spikes don't kick it up. Quiet levels: 1 below fan_l2, then
# 2/3/4 from fan_l2/fan_l3/fan_l4 °C. Loud levels only near max: 5 within
# fan_loud_margin_c of max, 7 at max. The firmware takes the fan back after
# fan_watchdog_s if the helper stops. fan_control=0 leaves the fan to the
# firmware. T14s Gen 1 rpm: L1 2550, L2 3070, L3 3210, L4 3380, L5 4300, L7 4720.
#fan_control=1
#fan_min_level=1
#fan_l2=60
#fan_l3=66
#fan_l4=71
#fan_loud_margin_c=2
# While Quiet/Background the plugin caps the fan at level 4 (power does the
# rest). Seconds between steps down:
#fan_down_s=10
#fan_watchdog_s=120
